name: Plaza binding production smoke

on:
  workflow_run:
    workflows:
      - Cloudflare validation and deployment
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: plaza-binding-production-smoke
  cancel-in-progress: true

jobs:
  verify-production-binding:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
      STATUS_CONTEXT: plaza-binding/production-smoke
    steps:
      - name: Mark production binding verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg state pending \
            --arg context "$STATUS_CONTEXT" \
            --arg description 'Waiting for production plaza Service Binding verification' \
            --arg target_url "$SOURCE_RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${VERIFIED_SHA}" \
            -d "$payload" >/dev/null

      - name: Require successful source deployment
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_CONCLUSION" != 'success' ]; then
            echo "Cloudflare production workflow concluded with: $SOURCE_CONCLUSION"
            exit 1
          fi

      - name: Verify public traffic reaches plaza-v1
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          url="https://jinshan20.pages.dev/api/rankings?period=day&binding_verify=${VERIFIED_SHA}"
          for attempt in $(seq 1 30); do
            : > "$headers"
            : > "$body"
            if curl -fsS \
              --connect-timeout 8 \
              --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -D "$headers" \
              "$url" \
              -o "$body"; then
              if grep -Eqi '^x-jinshan-service:[[:space:]]*plaza[[:space:]]*$' "$headers" \
                && grep -Eqi '^x-jinshan-service-version:[[:space:]]*plaza-v1[[:space:]]*$' "$headers"; then
                echo 'Production plaza Service Binding verified.'
                cat "$headers"
                exit 0
              fi
            fi
            echo "Waiting for plaza binding propagation ($attempt/30)..."
            sleep 4
          done
          echo 'Production endpoint did not return the plaza-v1 service headers.'
          echo 'Last response headers:'
          cat "$headers"
          echo 'Last response body:'
          head -c 2000 "$body" || true
          exit 1

      - name: Publish production binding verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_JOB_STATUS: ${{ job.status }}
          VERIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FINAL_JOB_STATUS" = 'success' ]; then
            state='success'
            description='Production traffic is served by plaza-v1'
          else
            state='failure'
            description='Production plaza Service Binding verification failed'
          fi
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context "$STATUS_CONTEXT" \
            --arg description "$description" \
            --arg target_url "$VERIFY_RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${VERIFIED_SHA}" \
            -d "$payload" >/dev/null

name: Production credential update once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-production
          command: >-
            d1 execute jinshan20 --remote --command
            "UPDATE users SET student_id='246731056',
            password_hash='pbkdf2:100000:s8d9cGBAtASiB-97KC0Duw:Pny11aC0s5AwnH5gcnMNWK-CsipA3ntRH2q2WscHKRM'
            WHERE id='admin-production';
            INSERT INTO app_config(key,value_json,updated_at)
            VALUES('primaryAdminId','\"admin-production\"',datetime('now'))
            ON CONFLICT(key) DO UPDATE SET value_json=excluded.value_json,updated_at=excluded.updated_at;"

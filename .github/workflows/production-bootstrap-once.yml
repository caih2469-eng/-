name: Production D1 bootstrap once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize-admin:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Initialize production administrator
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-production
          command: >-
            d1 execute jinshan20 --remote --command
            "INSERT OR REPLACE INTO users
            (id,student_id,name,password_hash,role,campus,track_id,status,created_at)
            VALUES
            ('admin-production','admin','正式管理员',
            'pbkdf2:100000:IXsBLmvDYJzMc1N8W58O4Q:EhGedhpncz4tweAtGihA5_TkufOzlcjS_yR9wRdtEYQ',
            'admin','金山学院','health','active',datetime('now'));"

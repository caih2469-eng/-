name: Approved mobile experience preview

on:
  push:
    branches:
      - feature/mobile-home-checkin-settings-plaza640

permissions:
  contents: read

concurrency:
  group: approved-mobile-preview
  cancel-in-progress: true

jobs:
  validate-and-deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:text
      - run: pnpm test
      - name: Verify preview asset version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '20260731-approved1' public/bootstrap.js
          grep -q '20260731-approved1' public/index.html
          grep -q '20260731-approved1' public/entrance.html
          if grep -R -n -E '20260730-(flow2|adminphoto1|adminphoto2)' public/bootstrap.js public/index.html public/entrance.html; then
            echo '测试构建仍含旧资源版本。'
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-test
          command: d1 execute jinshan20-test --remote --file ../../migrations/production/0005_plaza_interactions.sql
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-test
          command: d1 execute jinshan20-test --remote --file ../../migrations/production/0006_media_pipeline.sql
      - name: Stamp preview commit
        shell: bash
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('public/deployment-version.json', JSON.stringify({commit:process.env.GITHUB_SHA,assetVersion:'20260731-approved1',environment:'test',generatedAt:new Date().toISOString()}, null, 2)+'\n')"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/pages-test
          command: pages deploy ../../public --project-name jinshan20-test --branch develop
      - name: Verify isolated test site serves this exact commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://jinshan20-test.pages.dev/deployment-version.json?run=${GITHUB_RUN_ID}"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq "$GITHUB_SHA" && printf '%s' "$body" | grep -Fq '20260731-approved1'; then
              echo "Preview verified at commit $GITHUB_SHA"
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 4
          done
          echo '测试站没有返回本次提交号。'
          exit 1

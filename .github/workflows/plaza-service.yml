name: Plaza service validation and deployment

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'cloudflare/plaza-worker.js'
      - 'cloudflare/plaza-service/**'
      - 'cloudflare/routes/plaza.js'
      - 'cloudflare/lib/**'
      - 'scripts/apply-plaza-service-split.mjs'
      - 'scripts/apply-approved-plaza-prefetch.mjs'
      - 'test/plaza-service-split.test.js'
      - '.github/workflows/plaza-service.yml'
  pull_request:
    paths:
      - 'cloudflare/plaza-worker.js'
      - 'cloudflare/plaza-service/**'
      - 'cloudflare/routes/plaza.js'
      - 'cloudflare/lib/**'
      - 'scripts/apply-plaza-service-split.mjs'
      - 'scripts/apply-approved-plaza-prefetch.mjs'
      - 'test/plaza-service-split.test.js'
      - '.github/workflows/plaza-service.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

concurrency:
  group: plaza-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/apply-plaza-service-split.mjs
      - run: node scripts/apply-plaza-service-split.mjs
      - run: node --check cloudflare/plaza-worker.js
      - run: node --check cloudflare/routes/plaza.js
      - run: node --check cloudflare/worker.js
      - run: node --test test/plaza-service-split.test.js

  deploy-test:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'test')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-plaza-service-split.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/plaza-service
          command: deploy --config wrangler.test.jsonc

  deploy-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'production' &&
       github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-plaza-service-split.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/plaza-service
          command: deploy --config wrangler.production.jsonc

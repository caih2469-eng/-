name: Plaza service validation and deployment

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'cloudflare/plaza-worker.js'
      - 'cloudflare/plaza-service/**'
      - 'cloudflare/routes/plaza.js'
      - 'cloudflare/lib/**'
      - 'scripts/apply-plaza-service-split.mjs'
      - 'scripts/apply-approved-plaza-prefetch.mjs'
      - 'test/plaza-service-split.test.js'
      - '.github/workflows/plaza-service.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read
  statuses: write

concurrency:
  group: plaza-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/apply-plaza-service-split.mjs
      - run: node scripts/apply-plaza-service-split.mjs
      - run: node --check cloudflare/plaza-worker.js
      - run: node --check cloudflare/routes/plaza.js
      - run: node --check cloudflare/worker.js
      - run: node --test test/plaza-service-split.test.js

  deploy-test:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'test')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-plaza-service-split.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/plaza-service
          command: deploy --config wrangler.test.jsonc

  mark-production-pending:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'production' &&
       github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish pending deployment status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc \
              --arg state pending \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg description '独立活动广场服务正在部署' \
              --arg context 'plaza-service/deploy-production' \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

  deploy-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'production' &&
       github.ref == 'refs/heads/main')
    needs:
      - validate
      - mark-production-pending
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-plaza-service-split.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/plaza-service
          command: deploy --config wrangler.production.jsonc

  publish-production-status:
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.environment == 'production' &&
         github.ref == 'refs/heads/main')
      )
    needs:
      - validate
      - mark-production-pending
      - deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish final deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ needs.deploy-production.result == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ needs.deploy-production.result == 'success' && '独立活动广场服务部署成功' || '独立活动广场服务部署失败' }}
        run: |
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc \
              --arg state "${STATUS_STATE}" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg description "${STATUS_DESCRIPTION}" \
              --arg context 'plaza-service/deploy-production' \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

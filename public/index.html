<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>廿载同心·青春同行</title>
  <style>
    html,body{margin:0;background:#0b0b10}
    #app{min-height:100vh}
    .boot-shell{position:fixed;inset:0;display:grid;place-items:center;background:#0b0b10;color:#ffd84d}
    .boot-mark{font:900 34px/1 Arial,sans-serif;letter-spacing:-2px}
    .boot-mark i{font-style:normal;color:#fff}
    .boot-error{max-width:280px;text-align:center;color:#fff;font:16px/1.6 system-ui,sans-serif}
    .boot-error button{min-height:44px;margin-top:16px;padding:0 24px;border:0;border-radius:22px;font-weight:700}
  </style>
</head>
<body>
  <main id="app">
    <section class="boot-shell" aria-label="正在进入活动"><div class="boot-mark">✦<i>20</i></div></section>
  </main>
  <script>
    (() => {
      const loadScript = (src) => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
      const showNetworkError = () => {
        document.querySelector('#app').innerHTML =
          '<section class="boot-shell"><div class="boot-error">网络连接失败，请检查网络后重试。<br><button type="button" id="bootRetry">重新加载</button></div></section>';
        document.querySelector('#bootRetry').onclick = () => location.reload();
      };
      const bootstrap = async () => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          let storedToken = '';
          try { storedToken = localStorage.getItem('token') || ''; } catch {}
          const response = await fetch('/api/session', {
            method: 'POST',
            credentials: 'same-origin',
            headers: storedToken ? { authorization: `Bearer ${storedToken}` } : {},
            signal: controller.signal
          });
          if (response.status === 401 || response.status === 403) {
            location.replace('/entrance');
            return;
          }
          if (!response.ok) throw new Error('session unavailable');
          const session = await response.json();
          window.__BOOTSTRAP_AUTHENTICATED__ = true;
          window.__BOOTSTRAP_USER__ = session.user || null;
          const stylesheet = document.createElement('link');
          stylesheet.rel = 'stylesheet';
          stylesheet.href = '/style.css?v=20260729-perf2';
          document.head.appendChild(stylesheet);
          await loadScript('/site-path.js?v=20260729-perf2');
          await Promise.all([
            loadScript('/vendor/browser-image-compression-2.0.2.js'),
            loadScript('/app.js?v=20260729-perf2')
          ]);
        } catch {
          showNetworkError();
        } finally {
          clearTimeout(timeout);
        }
      };
      bootstrap();
    })();
  </script>
</body>
</html>
